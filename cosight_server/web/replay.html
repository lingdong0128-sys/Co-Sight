<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务回放历史 - Co-Sight</title>
    <link rel="icon" href="favicon.ico">
    <link href="libs/fontawesome-6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/replay.css">
</head>
<body>
    <div class="replay-container">
        <div class="replay-header">
            <h1><i class="fas fa-history"></i> 任务回放历史</h1>
            <div class="replay-header-buttons">
                <button class="btn-back" onclick="goBackToCurrentTask()" id="btn-back-to-task" style="display: none;">
                    <i class="fas fa-arrow-left"></i> 返回当前任务
                </button>
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> 返回主页
                </button>
            </div>
        </div>

        <div class="replay-filter">
            <input type="text" id="search-input" placeholder="搜索任务标题..." 
                   class="search-input">
            <select id="time-filter" class="time-filter">
                <option value="all">全部时间</option>
                <option value="today">今天</option>
                <option value="week">最近一周</option>
                <option value="month">最近一月</option>
            </select>
        </div>

        <div class="replay-list" id="replay-list">
            <!-- 动态生成回放项目 -->
        </div>

        <div class="loading" id="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> 加载中...
        </div>
    </div>

    <script src="js/replay-list.js"></script>
    <script>
        // 返回主页的函数
        function goBack() {
            const targetPage = window.location.pathname.includes('/cosight/') 
                ? 'index.html' 
                : '/cosight/index.html';
            window.location.href = targetPage;
        }

        // 返回当前任务的函数
        function goBackToCurrentTask() {
            // 检查是否有正在进行的任务（通过localStorage判断）
            const lastManusStep = localStorage.getItem('cosight:lastManusStep');
            if (lastManusStep) {
                // 有正在进行的任务，返回主页面并保持当前任务状态
                const targetPage = window.location.pathname.includes('/cosight/') 
                    ? 'index.html' 
                    : '/cosight/index.html';
                // 添加一个标记，表示是返回当前任务，不要清空localStorage
                sessionStorage.setItem('cosight:returnToCurrentTask', 'true');
                window.location.href = targetPage;
            } else {
                // 没有正在进行的任务，隐藏按钮或提示
                document.getElementById('btn-back-to-task').style.display = 'none';
            }
        }

        // 页面加载时检查是否有正在进行的任务，显示"返回当前任务"按钮
        window.addEventListener('DOMContentLoaded', function() {
            const lastManusStep = localStorage.getItem('cosight:lastManusStep');
            const btnBackToTask = document.getElementById('btn-back-to-task');
            if (lastManusStep && btnBackToTask) {
                btnBackToTask.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
